<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>闪寻 · 搜索演示</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--panel:#fff;--text:#202124;--sub:#70747c;--line:#e4e5e9;--accent:#007aff;--select:#eaf3ff;--key:#eceef2;--gap:#f0f0f3}
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:880px;margin:auto;padding:22px 30px 18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-size:17px;margin:0;font-weight:600}header span{font-size:12px;color:var(--sub)}
.chapters{display:flex;gap:20px;margin:14px 0 10px;color:var(--sub);font-size:12px}
.chapter{display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.chapter.active{color:var(--accent)}.active .dot{background:var(--accent)}
.coach{height:56px}h2{font-size:20px;margin:0 0 6px;font-weight:600;letter-spacing:-.4px;line-height:1.25}
#detail{color:var(--sub);line-height:1.5;margin:0;font-size:12.5px}

/* 两块玻璃：搜索框模块 / 结果模块，中间留一道缝——与真实窗口一致 */
.stage{display:flex;flex-direction:column;gap:7px;margin:6px 0 14px}
.module{position:relative;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 10px 28px #0000000d;overflow:hidden}
.search-bar{height:62px;display:flex;gap:10px;align-items:center;padding:0 20px;outline:none}
.search-bar:focus-visible{box-shadow:inset 0 0 0 2px #007aff55}
.magnifier{height:17px;width:17px;border:2px solid var(--sub);border-radius:50%;position:relative;margin-right:6px;flex-shrink:0}
.magnifier:after{content:"";position:absolute;bottom:-5px;right:-5px;width:8px;height:2px;background:var(--sub);transform:rotate(45deg)}
#tokens{display:flex;gap:6px;flex-shrink:0}
.token{color:var(--accent);font-size:13px;padding:4px 8px;border-radius:6px;background:var(--select)}
.query{font-size:21px;min-width:0;display:flex;align-items:center;flex:1}
.placeholder{color:var(--sub);font-size:18px;opacity:.6}
.caret{height:22px;width:2px;background:var(--accent);margin-left:2px;animation:blink 1s steps(2) infinite}
.search-bar small{font-size:11px;color:var(--sub);flex-shrink:0}
@keyframes blink{50%{opacity:0}}

/* 类型条：结果模块的第一行 */
.typebar{height:34px;display:flex;align-items:center;gap:3px;padding:0 12px;border-bottom:1px solid var(--line)}
.seg{font-size:11.5px;padding:3px 7px;border-radius:6px;color:var(--text);white-space:nowrap;transition:none}
.seg.on{background:var(--select);color:var(--accent);font-weight:600}
.sep{width:1px;height:15px;background:var(--line);margin-left:auto;margin-right:2px}
.pin{border:0;background:none;padding:2px 5px;border-radius:6px;color:var(--sub);cursor:default;display:flex;align-items:center}
.pin svg{width:13px;height:13px;display:block}
.pin.on{background:var(--select);color:var(--accent)}
.pin.hot{box-shadow:0 0 0 2px #007aff44}

.results-wrap{display:flex;align-items:stretch}
.sidebar{width:132px;flex-shrink:0;border-right:1px solid var(--line);padding:7px 7px;display:flex;flex-direction:column;gap:1px}
.side{font-size:12px;padding:6px 8px;border-radius:7px;border:0;background:none;text-align:left;color:var(--text);cursor:default;line-height:1.3}
.side.on{background:var(--select);color:var(--accent);font-weight:600}
.side small{display:block;font-size:10px;color:var(--sub);font-weight:400;margin-top:1px}
.results{flex:1;min-width:0;padding:7px;height:280px;overflow:hidden}
.empty{height:100%;display:grid;place-content:center;color:var(--sub);text-align:center;gap:7px}
.empty strong{font-weight:400;font-size:13.5px}.empty span{font-size:11.5px}
.row{display:flex;align-items:center;gap:11px;border-radius:8px;padding:8px 11px}
.row.selected{background:var(--select)}
.file-icon{display:grid;place-content:center;width:32px;height:32px;background:var(--key);border-radius:8px;font-size:19px;flex-shrink:0}
.row.selected .file-icon{background:var(--panel)}
.row-title{font-size:13px}.row-subtitle{color:var(--sub);font-size:11px;margin-top:3px}
.statusbar{height:33px;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);color:var(--sub);font-size:11.5px}
.statusbar .grow{flex:1}
.more{border:0;background:none;color:var(--accent);font:inherit;font-size:11.5px;cursor:default;padding:2px 8px;border-radius:5px;margin-left:2px}
.more[hidden]{display:none}.more.hot{background:var(--select);box-shadow:0 0 0 2px #007aff33}
.badge{font-size:10.5px;color:var(--accent);background:var(--select);border-radius:5px;padding:2px 7px;flex-shrink:0;margin-right:4px}
.module.pinned{box-shadow:0 10px 28px #00000012,0 0 0 2px #007aff55}
.module.pinned .results{opacity:.82}

/* 预览浮层 */
#preview{position:absolute;inset:38px 12px 40px 140px;background:var(--panel);box-shadow:0 5px 28px #0003;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;z-index:2}
#preview[hidden]{display:none}
.art{background:linear-gradient(140deg,#a5c3ee,#4a6ba5);width:84px;height:84px;border-radius:12px;display:grid;place-content:center;color:white;font-size:44px}
#preview strong{font-weight:500;font-size:13.5px}#preview small{color:var(--sub);font-size:11px}
#preview .close-preview{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--sub);font-size:17px;padding:2px 6px;cursor:pointer}

kbd{font-family:inherit;font-size:11px;min-width:22px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--key);box-shadow:0 1px 0 var(--line);display:inline-block;text-align:center}
.statusbar kbd{font-size:10px;min-width:17px;padding:1px 4px;box-shadow:none}
.statusbar .hot{color:var(--accent)}.statusbar .hot kbd{background:var(--select);border-color:var(--accent);color:var(--accent)}
.figure{font-variant-numeric:tabular-nums;flex-shrink:0}
footer{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 12px;background:var(--panel);color:var(--text);cursor:pointer}
button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid #007aff55;outline-offset:2px}
button.primary{background:var(--accent);color:white;border-color:transparent;padding:7px 20px}
#status{flex:1;font-size:11px;color:var(--sub);text-align:right;margin-right:8px}
.caption{font-size:11px;color:var(--sub);margin:10px 0 0}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--panel:#2b2d31;--text:#efeff1;--sub:#a6a9b0;--line:#41434a;--accent:#5aa6ff;--select:#293e59;--key:#36383f;--gap:#1b1c1f}.module{box-shadow:0 10px 28px #0003}button.primary{background:#087bf3;color:#fff}.badge{background:#293e59}.module.pinned{box-shadow:0 10px 28px #0003,0 0 0 2px #5aa6ff66}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.caret{opacity:1}}
@media(max-width:700px){main{padding:18px 16px}.chapters{gap:10px}.keys{gap:10px}.search-bar{padding:0 14px}.sidebar{width:104px}#preview{inset:10px 20px}h2{font-size:17px}.coach{height:64px}.seg{padding:3px 4px;font-size:10.5px}}
</style>
</head>
<body>
<main>
<header><h1>这就是闪寻的搜索窗</h1><span>约 25 秒，快速看一遍</span></header>
<nav class="chapters" aria-label="演示进度">
  <span class="chapter" data-chapter="0"><i class="dot"></i>输入搜索</span>
  <span class="chapter" data-chapter="1"><i class="dot"></i>空格预览</span>
  <span class="chapter" data-chapter="2"><i class="dot"></i>筛选</span>
  <span class="chapter" data-chapter="3"><i class="dot"></i>钉住</span>
  <span class="chapter" data-chapter="4"><i class="dot"></i>继续搜索</span>
</nav>
<section class="coach" aria-live="polite"><h2 id="hint"></h2><p id="detail"></p></section>

<section class="stage" aria-label="示例搜索窗">
  <div class="module field-module" tabindex="0" aria-label="搜索框">
    <div class="search-bar">
      <span class="magnifier" aria-hidden="true"></span>
      <div id="tokens"></div>
      <div class="query" role="searchbox" aria-label="演示搜索框" aria-readonly="true">
        <span id="query"></span><span id="placeholder" class="placeholder">搜索文件与文件夹</span><span class="caret" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <div class="module results-module" id="resultsModule" aria-label="搜索结果">
    <div class="typebar" aria-label="文件类型">
      <span class="seg" data-type-id="type:all">全部</span><span class="seg" data-type-id="type:pdf">pdf</span><span class="seg" data-type-id="type:word">word</span><span class="seg" data-type-id="type:excel">excel</span><span class="seg" data-type-id="type:ppt">ppt</span><span class="seg" data-type-id="type:photo">照片</span><span class="seg" data-type-id="type:video">视频</span><span class="seg" data-type-id="type:music">音乐</span><span class="seg" data-type-id="type:archive">压缩包</span><span class="seg" data-type-id="type:document">文档</span>
      <i class="sep" aria-hidden="true"></i>
      <button class="pin" id="pin" type="button" aria-label="钉在桌面上" title="钉在桌面上">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 1.6 14.4 6.4l-1.6 1.6-.9-.9-2.8 2.8.2 2.2-1.2 1.2-2.7-2.7-3 3-.9-.9 3-3-2.7-2.7L3.9 5.1l2.2.2 2.8-2.8-.9-.9z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="results-wrap">
      <aside class="sidebar" aria-label="搜索位置">
        <button class="side on" data-loc="all" type="button">全部位置</button>
        <button class="side" data-loc="mac" type="button">此 Mac</button>
        <button class="side" data-loc="nas" type="button">项目资料<small>示例 NAS</small></button>
      </aside>
      <div id="results" class="results" aria-label="示例结果"></div>
    </div>
    <div class="statusbar">
      <span class="badge" id="pinnedBadge" hidden>已钉住 · 留在桌面</span>
      <span class="hintline"><kbd>↑</kbd> <kbd>↓</kbd> 选择　<span id="space-key"><kbd>Space</kbd> 预览</span>　<kbd>↵</kbd> 打开　<kbd>⌘↵</kbd> Finder</span>
      <span class="grow"></span>
      <span id="summary" class="figure">200 / 1,340 项</span>
      <button class="more" id="more" type="button" hidden>继续搜索</button>
    </div>
    <div id="preview" role="dialog" aria-label="空格快速预览" hidden>
      <button class="close-preview" aria-label="关闭预览">×</button>
      <div id="preview-art" class="art" aria-hidden="true">♫</div>
      <strong id="preview-title">周杰伦 - 晴天.mp3</strong>
      <small id="preview-kind">音频文件预览示意 · 不播放真实音频</small>
      <kbd>Space 再按一次关闭</kbd>
    </div>
  </div>
</section>

<footer>
  <button id="replay" type="button">重播</button>
  <button id="pause" type="button">暂停</button>
  <span id="status" role="status">正在演示</span>
  <button id="continue" type="button" class="primary">继续</button>
</footer>
<p class="caption">演示使用示例文件。类型与位置都在界面上点选，实际结果取决于你的搜索来源。</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const music = [
  ['♫','周杰伦 - 晴天.mp3','音乐 / 周杰伦'],
  ['♫','周杰伦 - 七里香.flac','音乐 / 周杰伦'],
  ['▧','周杰伦演唱会海报.jpg','图片 / 演唱会'],
  ['▤','周杰伦演唱会策划.docx','项目资料 / 策划'],
  ['▤','周杰伦演唱会预算.xlsx','项目资料 / 预算']
];
const docs = [
  ['▤','周杰伦演唱会策划.docx','项目资料 / 策划'],
  ['▤','周杰伦演唱会预算.xlsx','项目资料 / 预算'],
  ['▤','周杰伦歌单说明.pdf','项目资料 / 文档'],
  ['▤','周杰伦访谈提纲.docx','项目资料 / 访谈'],
  ['▤','周杰伦巡演合同.pdf','项目资料 / 合同']
];
// 「继续搜索」后再来一批：同样是文档，按名字排在后面。
const docsMore = docs.concat([
  ['▤','周杰伦票务结算.xlsx','项目资料 / 结算'],
  ['▤','周杰伦舞台图纸.pdf','项目资料 / 舞台'],
  ['▤','周杰伦彩排记录.docx','项目资料 / 彩排'],
  ['▤','周杰伦宣传文案.docx','项目资料 / 宣传']
]);
// 每帧是完整状态：暂停、重播或手动预览都不会留下上一环节的限定。
const frames = [
  {duration:900,  chapter:0, hint:'输入关键词就能搜索', detail:'名字、关键词都行，结果立刻出现在下面。'},
  {duration:170,  chapter:0, query:'周', hint:'输入关键词就能搜索', detail:'名字、关键词都行，结果立刻出现在下面。'},
  {duration:170,  chapter:0, query:'周杰', hint:'输入关键词就能搜索', detail:'名字、关键词都行，结果立刻出现在下面。'},
  {duration:1300, chapter:0, query:'周杰伦', rows:music, hint:'输入即搜，结果就在下面', detail:'用 ↑ ↓ 选择，按 Return 打开。'},

  {duration:900,  chapter:1, query:'周杰伦', rows:music, hint:'选中一行，按空格预览', detail:'不打开文件，也能先看一眼内容。', hot:'space'},
  {duration:1700, chapter:1, query:'周杰伦', rows:music, preview:true, hint:'这就是快速预览', detail:'再按一次 Space 关闭预览，接着选下一个。', hot:'space'},

  {duration:1200, chapter:2, query:'周杰伦', rows:music, hint:'结果上方是文件类型', detail:'点「文档」，列表里就只剩文档。', hot:'type'},
  {duration:1500, chapter:2, query:'周杰伦', type:'type:document', rows:docs, hint:'类型选好了，就只剩文档', detail:'再点「全部」可以取消类型。'},
  {duration:1300, chapter:2, query:'周杰伦', type:'type:document', location:'nas', rows:docs, hint:'左边选位置，只搜那里', detail:'位置与类型可以叠加，一起缩小范围。', hot:'location'},

  {duration:1300, chapter:3, query:'周杰伦', type:'type:document', location:'nas', rows:docs, hint:'想留着这批结果？钉住', detail:'点类型条最右边的图钉，它就不跟着搜索走了。', hot:'pin'},
  {duration:1900, chapter:3, query:'', type:'type:all', location:'all', rows:docs, pinned:true, hint:'钉住了，搜索框空出来', detail:'这批结果留在桌面上单独一窗；搜索框已经归零，接着搜下一组。'},

  {duration:1400, chapter:4, query:'周杰伦', type:'type:all', location:'all', rows:music, more:true, hint:'结果太多？先看最可能的', detail:'闪寻先给你最匹配的 200 条。', hot:'more'},
  {duration:1700, chapter:4, query:'周杰伦', type:'type:all', location:'all', rows:docsMore, more:true, figure:'400 / 1,340 项', hint:'点「继续搜索」，再放一批', detail:'一次再给 200 条，直到候选全部走完。', hot:'more'},
  {duration:0,    chapter:4, query:'周杰伦', type:'type:all', location:'all', rows:docsMore, hint:'已经会用了，继续设置吧', detail:'输入即搜 · 空格预览 · 类型条与左侧位置筛选 · 图钉钉住 · 继续搜索。'}
];

let index = 0, timer = null, paused = false, selected = 0;
const TOTAL = 1340;

function row(icon, title, subtitle, isSelected) {
  const node = document.createElement('div');
  node.className = 'row' + (isSelected ? ' selected' : '');
  const symbol = document.createElement('span');
  symbol.className = 'file-icon'; symbol.textContent = icon;
  const labels = document.createElement('div');
  const name = document.createElement('div'); name.className = 'row-title'; name.textContent = title;
  const sub = document.createElement('div'); sub.className = 'row-subtitle'; sub.textContent = subtitle;
  labels.append(name, sub);
  node.append(symbol, labels);
  return node;
}

function render() {
  const frame = frames[index];
  selected = 0;
  $('hint').textContent = frame.hint;
  $('detail').textContent = frame.detail || '看搜索框与结果的变化。';
  $('query').textContent = frame.query || '';
  $('placeholder').hidden = Boolean(frame.query || frame.tokens);
  $('tokens').replaceChildren(...(frame.tokens || []).map(label => {
    const node = document.createElement('span'); node.className = 'token'; node.textContent = label + ' ×'; return node;
  }));

  // 类型条：只有一段被点亮，其余都归「全部」。
  const typeID = frame.type || 'type:all';
  document.querySelectorAll('.seg').forEach(seg => seg.classList.toggle('on', seg.dataset.typeId === typeID));
  // 位置侧边栏：默认「全部位置」。
  const locID = frame.location || 'all';
  document.querySelectorAll('.side').forEach(side => side.classList.toggle('on', side.dataset.loc === locID));

  $('resultsModule').classList.toggle('pinned', Boolean(frame.pinned));
  $('pinnedBadge').hidden = !frame.pinned;

  const results = $('results');
  results.replaceChildren();
  if (frame.rows) {
    frame.rows.slice(0, 5).forEach((item, i) => results.append(row(item[0], item[1], item[2], i === 0)));
  } else {
    const empty = document.createElement('div'); empty.className = 'empty';
    const label = document.createElement('strong'); label.textContent = '一个搜索框，找到文件与应用';
    const note = document.createElement('span'); note.textContent = '本机 · NAS · 网络文件';
    empty.append(label, note); results.append(empty);
  }

  // 计数用真实格式「已显示 / 总数 项」：列表只画 5 行是示意，这个数字说的是
  // 状态栏上真会看到的东西（第一批 200，点一次「继续搜索」变 400）。
  $('summary').textContent = frame.figure || '200 / 1,340 项';
  $('more').hidden = !frame.more;
  $('more').classList.toggle('hot', frame.hot === 'more');

  updatePreview(frame.rows?.[0]?.[1] || music[0][1]);
  $('preview').hidden = !frame.preview;

  document.querySelectorAll('.chapter').forEach((chapter, i) => {
    chapter.classList.toggle('active', i === frame.chapter);
    if (i === frame.chapter) chapter.setAttribute('aria-current', 'step');
    else chapter.removeAttribute('aria-current');
  });
  $('space-key').classList.toggle('hot', frame.hot === 'space');
  $('pin').classList.toggle('on', Boolean(frame.pinned));
  $('pin').classList.toggle('hot', frame.hot === 'pin');
  document.querySelectorAll('.side').forEach(side => side.classList.toggle('hot', frame.hot === 'location' && side.dataset.loc === locID));
  updateControls();
}

function updateControls() {
  const ended = index === frames.length - 1;
  $('status').textContent = ended ? '演示完成，点击继续进入下一环节' : paused ? '已暂停，可按 Space 预览' : '正在演示';
  $('pause').textContent = paused ? '播放' : '暂停';
  $('pause').disabled = ended;
}

function schedule() {
  clearTimeout(timer);
  if (paused || !frames[index].duration) return;
  timer = setTimeout(() => { index++; render(); schedule(); }, frames[index].duration);
}

function setPaused(value) { paused = value; updateControls(); schedule(); }

function updatePreview(name) {
  $('preview-title').textContent = name;
  const audio = /\.(mp3|flac|m4a)$/.test(name);
  $('preview-art').textContent = audio ? '♫' : '▤';
  $('preview-kind').textContent = audio ? '音频文件预览示意 · 不播放真实音频' : '文稿快速预览示意 · 示例文件';
}

function togglePreview() {
  if (!frames[index].rows) return;
  setPaused(true);
  $('preview').hidden = !$('preview').hidden;
  updatePreview(frames[index].rows[selected][1]);
}

$('pause').addEventListener('click', () => setPaused(!paused));
$('replay').addEventListener('click', () => { clearTimeout(timer); index = 0; paused = false; render(); schedule(); });
$('preview').querySelector('button').addEventListener('click', () => { $('preview').hidden = true; });
$('continue').addEventListener('click', () => {
  clearTimeout(timer); paused = true;
  if (window.webkit?.messageHandlers?.onboarding) window.webkit.messageHandlers.onboarding.postMessage('continue');
  else {
    $('hint').textContent = '下一环节：设置搜索权限';
    $('detail').textContent = '在闪寻中，这里会返回原来的设置引导。';
    $('status').textContent = '演示结束';
    $('preview').hidden = true;
  }
});

document.addEventListener('keydown', event => {
  if (event.target.closest('button')) return;
  if (event.code === 'Space') { event.preventDefault(); togglePreview(); }
  if (event.key === 'Escape' && !$('preview').hidden) { event.preventDefault(); $('preview').hidden = true; }
  if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && frames[index].rows) {
    event.preventDefault(); setPaused(true);
    const rows = frames[index].rows;
    selected = (selected + (event.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
    Array.from($('results').children).forEach((node, i) => node.classList.toggle('selected', i === selected));
    if (!$('preview').hidden) updatePreview(rows[selected][1]);
  }
});

window.addEventListener('pagehide', () => clearTimeout(timer));
render(); schedule();
</script>
</body>
</html>
